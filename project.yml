name: Wanderlist
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
targets:
  Wanderlist:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
        excludes:
          - "DemoUITests.swift"
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Wanderlist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
  WanderlistUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: .
        includes:
          - "DemoUITests.swift"
    dependencies:
      - target: Wanderlist
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.WanderlistUITests
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: Wanderlist
schemes:
  Wanderlist:
    build:
      targets:
        Wanderlist: all
        WanderlistUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WanderlistUITests
