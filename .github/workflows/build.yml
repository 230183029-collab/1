name: Build and record

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        shell: bash
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Find project
        shell: bash
        run: |
          xcodebuild -version
          PROJ=$(find . -maxdepth 3 -name "*.xcodeproj" | head -1)
          echo "PROJ=$PROJ" >> $GITHUB_ENV
          xcodebuild -list -project "$PROJ"

      - name: Pick simulator
        shell: bash
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone [0-9]+" | head -1 | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}')
          echo "Simulator: $UDID"
          echo "UDID=$UDID" >> $GITHUB_ENV

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project "$PROJ" -scheme Wanderlist -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      - name: Run tour in simulator and record video
        shell: bash
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          sleep 5
          xcrun simctl io "$UDID" recordVideo --codec h264 --force demo_raw.mp4 &
          REC=$!
          sleep 3
          # screenshot in the middle of the tour
          ( sleep 30; xcrun simctl io "$UDID" screenshot screenshot.png ) &
          set +e
          xcodebuild test-without-building -project "$PROJ" -scheme Wanderlist \
            -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log
          sleep 3
          [ -f screenshot.png ] || xcrun simctl io "$UDID" screenshot screenshot.png
          kill -INT $REC
          wait $REC
          sleep 2
          ls -la demo_raw.mp4
          if ls ~/Library/Logs/DiagnosticReports/Wanderlist* 2>/dev/null; then
            echo "App crashed"; exit 1
          fi

      - name: Fix video (constant frame rate)
        if: always()
        shell: bash
        run: |
          [ -f demo_raw.mp4 ] || exit 0
          brew install ffmpeg || true
          if command -v ffmpeg >/dev/null; then
            ffmpeg -y -i demo_raw.mp4 \
              -vf "fps=30,scale=trunc(iw/2)*2:trunc(ih/2)*2,format=yuv420p" \
              -c:v libx264 -preset fast -crf 23 -movflags +faststart demo.mp4 || cp demo_raw.mp4 demo.mp4
          else
            cp demo_raw.mp4 demo.mp4
          fi
          ls -la demo*.mp4

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            demo.mp4
            demo_raw.mp4
            screenshot.png
            build.log
            test.log
